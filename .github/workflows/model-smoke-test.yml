name: Saved model smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/model-smoke-test.yml"
      - "scripts/check_model.py"
      - "src/sampler.py"
      - "models/*.keras"
  workflow_dispatch:

jobs:
  model-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "tensorflow-cpu==2.16.2" "numpy<2" scipy pandas matplotlib
      - name: Load checkpoint and reconstruct one synthetic waveform
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
          MPLBACKEND: "Agg"
        run: python -m scripts.check_model
